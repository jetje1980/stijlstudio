<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Snel toevoegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg:      #F8F5F1;
  --surface: #FFFFFF;
  --border:  #E8DDD2;
  --text:    #1C140E;
  --text-2:  #8A7060;
  --accent:  #9B7B5C;
  --green:   #2D7A4F;
  --red:     #C0392B;
  --ph-bg:   #EDE5DA;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1A1410; --surface:#231C16; --border:#342620;
    --text:#F0E6D8; --text-2:#9A7E68; --accent:#C4976A; --ph-bg:#2C2018;
  }
}
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  min-height: 100%;
  max-width: 480px;
  margin: 0 auto;
}

/* HEADER */
.top-bar {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.top-bar h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 500;
  flex: 1;
}
.top-bar h1 span { color: var(--accent); }
.back-link {
  font-size: 20px;
  text-decoration: none;
  color: var(--text-2);
  line-height: 1;
}

/* SCROLL AREA */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* PHOTO ZONE */
.photo-zone {
  position: relative;
  width: 100%;
  aspect-ratio: 4/3;
  background: var(--ph-bg);
  border: 2px dashed var(--border);
  border-radius: 16px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: border-color .2s;
}
.photo-zone:active { border-color: var(--accent); }
.photo-zone img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.photo-zone .ph-icon { font-size: 40px; pointer-events: none; }
.photo-zone .ph-text {
  font-size: 13px;
  color: var(--text-2);
  font-weight: 500;
  pointer-events: none;
}
.photo-zone .change-badge {
  display: none;
  position: absolute;
  bottom: 10px;
  right: 10px;
  background: rgba(0,0,0,.55);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
}
.photo-zone.has-photo .change-badge { display: block; }
.photo-zone.has-photo .ph-icon,
.photo-zone.has-photo .ph-text { display: none; }
#file-input { display: none; }

/* SECTION LABEL */
.sec-label {
  font-size: 9px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 8px;
}

/* NAME INPUT */
.name-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  color: var(--text);
  outline: none;
  transition: border-color .2s;
}
.name-input:focus { border-color: var(--accent); }
.name-input::placeholder { color: var(--text-2); }

/* CATEGORY GRID */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.cat-btn {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent;
}
.cat-btn .cat-icon { font-size: 24px; }
.cat-btn .cat-name {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-2);
  text-align: center;
  line-height: 1.3;
}
.cat-btn.selected {
  border-color: var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, var(--surface));
}
.cat-btn.selected .cat-name { color: var(--accent); }

/* SAVE BUTTON */
#save-btn {
  width: 100%;
  padding: 16px;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  letter-spacing: .01em;
  transition: opacity .15s;
  -webkit-tap-highlight-color: transparent;
}
#save-btn:disabled { opacity: .35; cursor: default; }
#save-btn:not(:disabled):active { opacity: .75; }

/* PROGRESS */
#progress-bar {
  display: none;
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
  margin-top: -12px;
}
#progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0;
  transition: width .3s;
}
#status-msg {
  font-size: 12px;
  color: var(--text-2);
  text-align: center;
  min-height: 18px;
}

/* SUCCESS */
#success-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 40px 20px;
  flex: 1;
}
#success-screen .success-icon { font-size: 56px; }
#success-screen h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  font-weight: 500;
}
#success-screen .success-name {
  font-size: 13px;
  color: var(--text-2);
}
.success-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 300px;
  margin-top: 8px;
}
.btn-primary {
  padding: 14px;
  background: var(--text);
  color: var(--bg);
  border: none;
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-secondary {
  padding: 14px;
  background: transparent;
  color: var(--text-2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  display: block;
  text-align: center;
}
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="griette.html">←</a>
  <h1>Snel <span>toevoegen</span></h1>
</div>

<div class="scroll-area" id="form-area">

  <!-- PHOTO -->
  <div>
    <div class="sec-label">Foto</div>
    <div class="photo-zone" id="photo-zone" onclick="document.getElementById('file-input').click()">
      <span class="ph-icon">📷</span>
      <span class="ph-text">Tik om foto te kiezen of te schieten</span>
      <img id="preview-img" style="display:none">
      <span class="change-badge">Wijzigen</span>
    </div>
    <input type="file" id="file-input" accept="image/*" capture="environment">
  </div>

  <!-- NAME -->
  <div>
    <div class="sec-label">Naam</div>
    <input class="name-input" type="text" id="item-name" placeholder="bijv. Bruine suède laarsjes" autocomplete="off">
  </div>

  <!-- CATEGORY -->
  <div>
    <div class="sec-label">Categorie</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- STATUS -->
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <div id="status-msg"></div>

  <!-- SAVE -->
  <button id="save-btn" disabled onclick="saveItem()">Opslaan</button>

</div>

<div id="success-screen">
  <div class="success-icon">✓</div>
  <h2>Toegevoegd!</h2>
  <div class="success-name" id="success-name"></div>
  <div class="success-actions">
    <button class="btn-primary" onclick="resetForm()">Nog een item toevoegen</button>
    <a class="btn-secondary" href="griette.html">Terug naar garderobe</a>
  </div>
</div>

<script>
const CATS = [
  {id:'tops',        icon:'👕', label:'Tops'},
  {id:'bottoms',     icon:'👖', label:'Bottoms & Rokken'},
  {id:'layers',      icon:'🧥', label:'Laagjes'},
  {id:'jurken',      icon:'👗', label:'Jurken'},
  {id:'bags',        icon:'👜', label:'Tassen'},
  {id:'shoes',       icon:'👟', label:'Schoenen'},
  {id:'accessories', icon:'🕶️', label:'Accessoires'},
  {id:'swimwear',    icon:'🩱', label:'Zwemwear'},
  {id:'overig',      icon:'📦', label:'Overig'},
];

const CLOUDINARY_CLOUD  = 'dhggari0g';
const CLOUDINARY_PRESET = 'griette-photos';
const SUPABASE_URL = 'https://osuqtfsxmquwqsbgzlqn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zdXF0ZnN4bXF1d3FzYmd6bHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzI0OTksImV4cCI6MjA5MDk0ODQ5OX0.E868cVw3-ClR3OQtJ4fCxmZGoUi1Dgx6pyGHBULZjeU';

let selectedCat = null;
let selectedFile = null;

// Build category grid
const grid = document.getElementById('cat-grid');
CATS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name">${c.label}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCat = c.id;
    checkReady();
  });
  grid.appendChild(btn);
});

// File input
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;

  // Show preview
  const img = document.getElementById('preview-img');
  img.src = URL.createObjectURL(file);
  img.style.display = 'block';
  document.getElementById('photo-zone').classList.add('has-photo');

  // Pre-fill name from filename if empty
  const nameInput = document.getElementById('item-name');
  if (!nameInput.value.trim()) {
    const base = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    nameInput.value = base;
  }
  checkReady();
});

document.getElementById('item-name').addEventListener('input', checkReady);

function checkReady() {
  const name = document.getElementById('item-name').value.trim();
  document.getElementById('save-btn').disabled = !(name && selectedCat);
}

// Supabase helpers
async function sbGet(key) {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/griette_data?key=eq.' + encodeURIComponent(key) + '&select=value&limit=1', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    const d = await r.json();
    return (d && d.length) ? JSON.parse(d[0].value) : null;
  } catch(e) { return null; }
}

async function sbSet(key, value) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/griette_data', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
    });
  } catch(e) {}
}

async function saveItem() {
  const name = document.getElementById('item-name').value.trim();
  if (!name || !selectedCat) return;

  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  const pb = document.getElementById('progress-bar');
  const pf = document.getElementById('progress-fill');
  const sm = document.getElementById('status-msg');
  pb.style.display = 'block';

  const id = 'custom-' + Date.now();

  // Step 1: upload photo to Cloudinary (if selected)
  let photoUrl = null;
  if (selectedFile) {
    sm.textContent = 'Foto uploaden…';
    pf.style.width = '20%';
    try {
      const fd = new FormData();
      fd.append('file', selectedFile);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('public_id', 'griette-wardrobe/griette_' + id);
      fd.append('folder', 'griette-wardrobe');
      const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', { method: 'POST', body: fd });
      const json = await res.json();
      photoUrl = json.secure_url || null;
    } catch(e) {}
  }
  pf.style.width = '50%';

  // Step 2: save item to Supabase custom-items
  sm.textContent = 'Item opslaan…';
  const existing = await sbGet('custom-items') || {};
  if (!existing[selectedCat]) existing[selectedCat] = [];
  existing[selectedCat].push({ id, name });
  await sbSet('custom-items', existing);
  pf.style.width = '75%';

  // Step 3: save photo URL to Supabase cloud-photos
  if (photoUrl) {
    const photos = await sbGet('cloud-photos') || {};
    photos[id] = photoUrl;
    await sbSet('cloud-photos', photos);

    // Also localStorage
    try {
      const lsp = JSON.parse(localStorage.getItem('griette-cloud-photos-v1') || '{}');
      lsp[id] = photoUrl;
      localStorage.setItem('griette-cloud-photos-v1', JSON.stringify(lsp));
    } catch(e) {}
  }

  // Also localStorage for custom-items
  try {
    const lsi = JSON.parse(localStorage.getItem('griette-custom-items-v3') || '{}');
    if (!lsi[selectedCat]) lsi[selectedCat] = [];
    lsi[selectedCat].push({ id, name });
    localStorage.setItem('griette-custom-items-v3', JSON.stringify(lsi));
  } catch(e) {}

  pf.style.width = '100%';
  sm.textContent = '';

  // Show success
  setTimeout(() => {
    document.getElementById('form-area').style.display = 'none';
    const ss = document.getElementById('success-screen');
    ss.style.display = 'flex';
    document.getElementById('success-name').textContent = name + ' · ' + CATS.find(c => c.id === selectedCat)?.label;
  }, 300);
}

function resetForm() {
  selectedFile = null;
  selectedCat = null;

  document.getElementById('preview-img').src = '';
  document.getElementById('preview-img').style.display = 'none';
  document.getElementById('photo-zone').classList.remove('has-photo');
  document.getElementById('file-input').value = '';
  document.getElementById('item-name').value = '';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('save-btn').disabled = true;
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('progress-fill').style.width = '0';
  document.getElementById('status-msg').textContent = '';

  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('form-area').style.display = 'flex';
}
</script>
</body>
</html>
