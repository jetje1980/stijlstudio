<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Snel toevoegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg:      #F8F5F1;
  --surface: #FFFFFF;
  --border:  #E8DDD2;
  --text:    #1C140E;
  --text-2:  #8A7060;
  --accent:  #9B7B5C;
  --green:   #2D7A4F;
  --ph-bg:   #EDE5DA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#1A1410; --surface:#231C16; --border:#342620;
    --text:#F0E6D8; --text-2:#9A7E68; --accent:#C4976A; --ph-bg:#2C2018;
  }
}
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
html, body { height:100%; }
body {
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg); color:var(--text);
  display:flex; flex-direction:column;
  min-height:100%; max-width:480px; margin:0 auto;
}

.top-bar {
  padding:16px 20px 12px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
  flex-shrink:0; background:var(--bg);
  position:sticky; top:0; z-index:10;
}
.top-bar h1 { font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:500; flex:1; }
.top-bar h1 span { color:var(--accent); }
.back-link { font-size:20px; text-decoration:none; color:var(--text-2); line-height:1; }

.scroll-area {
  flex:1; overflow-y:auto;
  padding:20px 20px calc(100px + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; gap:22px;
}

/* PHOTO */
.photo-wrap { position:relative; }
.photo-zone {
  width:100%; aspect-ratio:4/3;
  background:var(--ph-bg);
  border:2px dashed var(--border);
  border-radius:16px; overflow:hidden;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:10px;
  cursor:pointer;
}
.photo-zone .ph-icon { font-size:40px; pointer-events:none; }
.photo-zone .ph-text { font-size:13px; color:var(--text-2); font-weight:500; pointer-events:none; }
.photo-zone img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; }
.photo-zone.has-photo .ph-icon,
.photo-zone.has-photo .ph-text { display:none; }
.photo-zone.has-photo img { display:block; }
.change-badge {
  display:none; position:absolute; bottom:10px; right:10px;
  background:rgba(0,0,0,.55); color:#fff;
  font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px;
}
.photo-zone.has-photo ~ .change-badge { display:block; }
.photo-actions {
  display:flex; gap:8px; margin-top:10px;
}
.photo-btn {
  flex:1; padding:11px 8px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:10px; font-family:'Inter',sans-serif;
  font-size:12px; font-weight:600; color:var(--text);
  cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:6px;
}
.photo-btn:active { opacity:.7; }
#file-camera, #file-gallery { display:none; }

/* SECTION LABEL */
.sec-label {
  font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--accent); font-weight:600; margin-bottom:8px;
}

/* NAME INPUT */
.name-input {
  width:100%; padding:14px 16px;
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:12px; font-family:'Inter',sans-serif;
  font-size:16px; color:var(--text); outline:none;
  transition:border-color .2s;
}
.name-input:focus { border-color:var(--accent); }
.name-input::placeholder { color:var(--text-2); }

/* CATEGORY GRID */
.cat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.cat-btn {
  background:var(--surface); border:1.5px solid var(--border);
  border-radius:12px; padding:14px 8px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  cursor:pointer; transition:border-color .15s, background .15s;
  -webkit-tap-highlight-color:transparent;
}
.cat-btn .cat-icon { font-size:24px; }
.cat-btn .cat-name { font-size:10px; font-weight:600; color:var(--text-2); text-align:center; line-height:1.3; }
.cat-btn.selected { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 10%,var(--surface)); }
.cat-btn.selected .cat-name { color:var(--accent); }

/* TAGS */
.tag-section { display:none; }
.tag-section.visible { display:block; }
.tag-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:4px; }
.tag-sub { font-size:10px; color:var(--text-2); margin:4px 0 6px; }

.tag-btn {
  padding:9px 13px; background:var(--surface);
  border:1.5px solid var(--border); border-radius:20px;
  font-family:'Inter',sans-serif; font-size:12px; font-weight:500;
  color:var(--text); cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  -webkit-tap-highlight-color:transparent;
  transition:border-color .12s, background .12s;
}
.tag-btn.selected { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,var(--surface)); color:var(--accent); font-weight:600; }
.tag-btn .dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:1px solid rgba(0,0,0,.12); }

/* BOTTOM BAR */
.bottom-bar {
  position:fixed; bottom:0; left:0; right:0;
  max-width:480px; margin:0 auto;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--bg); border-top:1px solid var(--border);
  display:flex; flex-direction:column; gap:8px;
}
#prog-bar { height:3px; background:var(--border); border-radius:3px; overflow:hidden; display:none; }
#prog-fill { height:100%; background:var(--accent); width:0; transition:width .3s; }
#status-msg { font-size:11px; color:var(--text-2); text-align:center; min-height:14px; }
#save-btn {
  width:100%; padding:16px; background:var(--text); color:var(--bg);
  border:none; border-radius:14px;
  font-family:'Inter',sans-serif; font-size:15px; font-weight:600;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
#save-btn:disabled { opacity:.35; cursor:default; }
#save-btn:not(:disabled):active { opacity:.75; }

/* SUCCESS */
#success-screen {
  display:none; flex-direction:column; align-items:center;
  justify-content:center; gap:16px; text-align:center;
  padding:40px 20px; flex:1;
}
#success-screen .sicon { font-size:56px; }
#success-screen h2 { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:500; }
#success-screen .sname { font-size:13px; color:var(--text-2); }
.success-actions { display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; margin-top:8px; }
.btn-primary { padding:14px; background:var(--text); color:var(--bg); border:none; border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; cursor:pointer; }
.btn-secondary { padding:14px; background:transparent; color:var(--text-2); border:1.5px solid var(--border); border-radius:12px; font-family:'Inter',sans-serif; font-size:14px; font-weight:500; text-decoration:none; display:block; text-align:center; }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="griette.html">←</a>
  <h1>Snel <span>toevoegen</span></h1>
</div>

<div class="scroll-area" id="form-area">

  <!-- FOTO -->
  <div>
    <div class="sec-label">Foto</div>
    <div class="photo-zone" id="photo-zone">
      <span class="ph-icon">📷</span>
      <span class="ph-text">Tik hieronder om foto te kiezen</span>
      <img id="preview-img">
    </div>
    <div class="photo-actions">
      <button class="photo-btn" onclick="document.getElementById('file-camera').click()">📷 Camera</button>
      <button class="photo-btn" onclick="document.getElementById('file-gallery').click()">🖼 Galerij</button>
    </div>
    <input type="file" id="file-camera"  accept="image/*" capture="environment">
    <input type="file" id="file-gallery" accept="image/*">
  </div>

  <!-- NAAM -->
  <div>
    <div class="sec-label">Naam</div>
    <input class="name-input" type="text" id="item-name" placeholder="bijv. Bruine suède laarsjes" autocomplete="off">
  </div>

  <!-- BESCHRIJVING -->
  <div>
    <div class="sec-label">Beschrijving <span style="font-size:9px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-2);">optioneel</span></div>
    <textarea class="name-input" id="item-desc" placeholder="bijv. Perfect voor een avondje uit, lekker wijd en soepel…" rows="2" style="resize:none;line-height:1.5;"></textarea>
  </div>

  <!-- CATEGORIE -->
  <div>
    <div class="sec-label">Categorie</div>
    <div class="cat-grid" id="cat-grid"></div>
  </div>

  <!-- TAGS (verschijnen na categorie-keuze) -->
  <div id="tags-area"></div>

</div>

<div id="success-screen">
  <div class="sicon">✓</div>
  <h2>Toegevoegd!</h2>
  <div class="sname" id="success-name"></div>
  <div class="success-actions">
    <button class="btn-primary" onclick="resetForm()">Nog een item toevoegen</button>
    <a class="btn-secondary" href="griette.html">Terug naar garderobe</a>
  </div>
</div>

<div class="bottom-bar" id="bottom-bar">
  <div id="prog-bar"><div id="prog-fill"></div></div>
  <div id="status-msg"></div>
  <button id="save-btn" disabled onclick="saveItem()">Opslaan</button>
</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const CATS = [
  {id:'tops',        icon:'👕', label:'Tops'},
  {id:'bottoms',     icon:'👖', label:'Bottoms & Rokken'},
  {id:'layers',      icon:'🧥', label:'Laagjes'},
  {id:'jurken',      icon:'👗', label:'Jurken'},
  {id:'bags',        icon:'👜', label:'Tassen'},
  {id:'shoes',       icon:'👟', label:'Schoenen'},
  {id:'accessories', icon:'🕶️', label:'Accessoires'},
  {id:'swimwear',    icon:'🩱', label:'Zwemwear'},
  {id:'overig',      icon:'📦', label:'Overig'},
];

const KLEUREN = [
  {v:'zwart',         dot:'#111'},
  {v:'donkerblauw',   dot:'#162038'},
  {v:'marine',        dot:'#1a2a4a'},
  {v:'bruin',         dot:'#5c3317'},
  {v:'cognac',        dot:'#8B4513'},
  {v:'camel',         dot:'#c19a6b'},
  {v:'beige',         dot:'#d4b896'},
  {v:'gebroken-wit',  dot:'#f0e8d8'},
  {v:'wit',           dot:'#f8f4ef'},
  {v:'grijs',         dot:'#888'},
  {v:'felroze',       dot:'#e8407a'},
  {v:'roze',          dot:'#e8a0b4'},
  {v:'lila/paars',    dot:'#b088c8'},
  {v:'paars',         dot:'#7b3fa0'},
  {v:'geel',          dot:'#d4b84a'},
  {v:'mosterd',       dot:'#b8860b'},
  {v:'oranje',        dot:'#d4703a'},
  {v:'oranje-rood',   dot:'#b5232a'},
  {v:'rood',          dot:'#cc2211'},
  {v:'lichtblauw',    dot:'#a8c4e0'},
  {v:'kobaltblauw',   dot:'#0047AB'},
  {v:'turquoise',     dot:'#2ab0a8'},
  {v:'mintgroen',     dot:'#88c8b0'},
  {v:'groen',         dot:'#4a8a5c'},
  {v:'olijf/khaki',   dot:'#6b7c45'},
  {v:'bordeaux',      dot:'#6e1020'},
  {v:'nude/huid',     dot:'#d4a882'},
  {v:'terra cotta',   dot:'#c1654a'},
];

const CLOUDINARY_CLOUD  = 'dhggari0g';
const CLOUDINARY_PRESET = 'griette-photos';
const SUPABASE_URL = 'https://osuqtfsxmquwqsbgzlqn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9zdXF0ZnN4bXF1d3FzYmd6bHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzNzI0OTksImV4cCI6MjA5MDk0ODQ5OX0.E868cVw3-ClR3OQtJ4fCxmZGoUi1Dgx6pyGHBULZjeU';

let selectedCat  = null;
let selectedFile = null;
const tags = {}; // {type: value or [values]}

// ── CATEGORY GRID ─────────────────────────────────────────────────────────────
const catGrid = document.getElementById('cat-grid');
CATS.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn';
  btn.innerHTML = `<span class="cat-icon">${c.icon}</span><span class="cat-name">${c.label}</span>`;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedCat = c.id;
    buildTags(c.id);
    checkReady();
  });
  catGrid.appendChild(btn);
});

const PATRONEN = [
  'uni','fijn streep','brede streep','ruit/check','pied-de-poule',
  'bloemenprint','luipaard/leopard','stippen/polka','abstract',
  'paisley','tie-dye','kant/broderie','snake print',
];

// ── TAG BUILDER ───────────────────────────────────────────────────────────────
function buildTags(cat) {
  const area = document.getElementById('tags-area');
  area.innerHTML = '';

  const isClothing   = ['tops','bottoms','layers','jurken'].includes(cat);
  const showHals     = ['tops','layers','jurken'].includes(cat);
  const showMouw     = ['tops','layers','jurken'].includes(cat);
  const showLengte   = ['tops','bottoms','jurken'].includes(cat);
  const showMateriaal = cat !== 'bags' && cat !== 'accessories';

  // KLEUR (multi-select)
  addSection(area, 'Kleur', '(meerdere mogelijk)', () => {
    const row = document.createElement('div');
    row.className = 'tag-row';
    KLEUREN.forEach(({v, dot}) => {
      row.appendChild(makeTagBtn(v, 'kleur', true, dot));
    });
    return row;
  });

  // PATROON (multi-select)
  addSection(area, 'Patroon', '(meerdere mogelijk)', () => {
    const row = document.createElement('div'); row.className = 'tag-row';
    PATRONEN.forEach(v => row.appendChild(makeTagBtn(v, 'patroon', true)));
    return row;
  });

  // PASVORM / TYPE — category-aware
  {
    let label, opts;
    if (isClothing) {
      label = 'Pasvorm';
      opts = ['aansluitend','licht oversized','wijd','cropped','gestructureerd','wrap','flared'];
    } else if (cat === 'shoes') {
      label = 'Schoentype';
      opts = ['sneakers','hakken','pumps','laarzen','enkellaarzen','mules','sandalen','ballerinas','loafers','slippers','boots'];
    } else if (cat === 'bags') {
      label = 'Tastype';
      opts = ['schoudertas','clutch/minitas','tote','rugzak','crossbody','bucket bag','shopper','portemonnee'];
    } else if (cat === 'accessories') {
      label = 'Type';
      opts = ['riem','sjaal/stola','hoed','pet','sieraad','zonnebril','handschoenen','andere'];
    } else if (cat === 'swimwear') {
      label = 'Type';
      opts = ['badpak','bikini','tankini','cover-up'];
    } else {
      label = null;
    }
    if (label) {
      addSection(area, label, null, () => {
        const row = document.createElement('div'); row.className = 'tag-row';
        opts.forEach(v => row.appendChild(makeTagBtn(v, 'pasvorm', false)));
        return row;
      });
    }
  }

  // HALS
  if (showHals) {
    addSection(area, 'Hals', null, () => {
      const row = document.createElement('div'); row.className = 'tag-row';
      ['ronde hals','V-hals','boothals','sweetheart','spaghetti','open knoop','gesloten/col','bardot/off-shoulder','halter','polo'].forEach(v => {
        row.appendChild(makeTagBtn(v, 'hals', false));
      });
      return row;
    });
  }

  // MOUW
  if (showMouw) {
    addSection(area, 'Mouw', null, () => {
      const row = document.createElement('div'); row.className = 'tag-row';
      ['mouwloos','kort','3/4','lang','raglan','pofmouw','ballon','vlindermouw','klokmouw'].forEach(v => {
        row.appendChild(makeTagBtn(v, 'mouw', false));
      });
      return row;
    });
  }

  // SEIZOEN
  addSection(area, 'Seizoen', null, () => {
    const row = document.createElement('div'); row.className = 'tag-row';
    [['☀️ zomer','zomer'],['❄️ winter','winter'],['🌱 beide','beide']].forEach(([label,v]) => {
      row.appendChild(makeTagBtn(label, 'seizoen', false, null, v));
    });
    return row;
  });

  // MATERIAAL (multi) — not for bags/accessories
  if (showMateriaal) {
    addSection(area, 'Materiaal', '(meerdere mogelijk)', () => {
      const wrap = document.createElement('div');
      const groups = [
        {label:'soepel:', items:['viscose','tencel','modal','satijn','jersey']},
        {label:'stevig:', items:['katoen','bio-katoen','denim','wol','linnen','rib']},
        {label:'gemengd:', items:['cashmere','merino','bamboe','fleece']},
        {label:'overig:', items:['leer','suède','velvet','neopreen','technisch']},
      ];
      groups.forEach(g => {
        const sub = document.createElement('div'); sub.className = 'tag-sub'; sub.textContent = g.label;
        wrap.appendChild(sub);
        const row = document.createElement('div'); row.className = 'tag-row';
        g.items.forEach(v => row.appendChild(makeTagBtn(v, 'materiaal', true)));
        wrap.appendChild(row);
      });
      return wrap;
    });

    // STOFGEWICHT
    addSection(area, 'Stofgewicht', null, () => {
      const row = document.createElement('div'); row.className = 'tag-row';
      ['luchtig','medium','stevig'].forEach(v => row.appendChild(makeTagBtn(v, 'structuur', false)));
      return row;
    });
  }

  // LENGTE
  if (showLengte) {
    addSection(area, 'Lengte', null, () => {
      const row = document.createElement('div'); row.className = 'tag-row';
      ['crop','normaal','midi','maxi','lang/tunic'].forEach(v => row.appendChild(makeTagBtn(v, 'lengte', false)));
      return row;
    });
  }

  area.classList.add('visible');
}

function addSection(parent, label, sub, buildContent) {
  const wrap = document.createElement('div');
  const lbl = document.createElement('div'); lbl.className = 'sec-label'; lbl.textContent = label + (sub ? ' ' : '');
  if (sub) { const s = document.createElement('span'); s.style.cssText = 'font-size:9px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text-2);'; s.textContent = sub; lbl.appendChild(s); }
  wrap.appendChild(lbl);
  wrap.appendChild(buildContent());
  parent.appendChild(wrap);
}

function makeTagBtn(label, type, multi, dot = null, value = null) {
  const v = value || label;
  const btn = document.createElement('button');
  btn.className = 'tag-btn';
  btn.dataset.type = type;
  btn.dataset.val  = v;
  btn.dataset.multi = multi ? '1' : '';

  if (dot) {
    const d = document.createElement('span');
    d.className = 'dot';
    d.style.background = dot;
    btn.appendChild(d);
  }
  btn.appendChild(document.createTextNode(label));

  btn.addEventListener('click', () => {
    if (multi) {
      btn.classList.toggle('selected');
      if (!Array.isArray(tags[type])) tags[type] = [];
      if (btn.classList.contains('selected')) {
        if (!tags[type].includes(v)) tags[type].push(v);
      } else {
        tags[type] = tags[type].filter(x => x !== v);
      }
    } else {
      // single select — deselect others in same type
      document.querySelectorAll(`.tag-btn[data-type="${type}"]`).forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      tags[type] = v;
    }
  });
  return btn;
}

// ── PHOTO ─────────────────────────────────────────────────────────────────────
function handleFile(file) {
  if (!file) return;
  selectedFile = file;
  const img = document.getElementById('preview-img');
  img.src = URL.createObjectURL(file);
  document.getElementById('photo-zone').classList.add('has-photo');

  const nameInput = document.getElementById('item-name');
  if (!nameInput.value.trim()) {
    const base = file.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    nameInput.value = base;
  }
  checkReady();
}

document.getElementById('file-camera').addEventListener('change',  e => handleFile(e.target.files[0]));
document.getElementById('file-gallery').addEventListener('change', e => handleFile(e.target.files[0]));
document.getElementById('item-name').addEventListener('input', checkReady);

function checkReady() {
  const name = document.getElementById('item-name').value.trim();
  document.getElementById('save-btn').disabled = !(name && selectedCat);
}

// ── SUPABASE ──────────────────────────────────────────────────────────────────
async function sbGet(key) {
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/griette_data?key=eq.' + encodeURIComponent(key) + '&select=value&limit=1', {
      headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
    });
    const d = await r.json();
    return (d && d.length) ? JSON.parse(d[0].value) : null;
  } catch(e) { return null; }
}

async function sbSet(key, value) {
  try {
    await fetch(SUPABASE_URL + '/rest/v1/griette_data', {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ key, value: JSON.stringify(value), updated_at: new Date().toISOString() })
    });
  } catch(e) {}
}

// ── SAVE ──────────────────────────────────────────────────────────────────────
async function saveItem() {
  const name = document.getElementById('item-name').value.trim();
  if (!name || !selectedCat) return;

  const btn   = document.getElementById('save-btn');
  btn.disabled = true;
  const pb = document.getElementById('prog-bar');
  const pf = document.getElementById('prog-fill');
  const sm = document.getElementById('status-msg');
  pb.style.display = 'block';

  const desc = (document.getElementById('item-desc').value || '').trim();
  const id = 'custom-' + Date.now();
  let photoUrl = null;

  // 1. Upload foto
  if (selectedFile) {
    sm.textContent = 'Foto uploaden…';
    pf.style.width = '20%';
    try {
      const fd = new FormData();
      fd.append('file', selectedFile);
      fd.append('upload_preset', CLOUDINARY_PRESET);
      fd.append('public_id', 'griette-wardrobe/griette_' + id);
      fd.append('folder', 'griette-wardrobe');
      const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD + '/image/upload', { method:'POST', body:fd });
      const json = await res.json();
      photoUrl = json.secure_url || null;
    } catch(e) {}
  }
  pf.style.width = '50%';

  // 2. Item opslaan in Supabase custom-items
  sm.textContent = 'Item opslaan…';
  const existing = await sbGet('custom-items') || {};
  if (!existing[selectedCat]) existing[selectedCat] = [];
  existing[selectedCat].push({ id, name, ...(desc ? {beschrijving: desc} : {}) });
  await sbSet('custom-items', existing);
  pf.style.width = '65%';

  // 3. Tags opslaan in Supabase item-tags
  const cleanTags = {};
  Object.entries(tags).forEach(([k, v]) => {
    if (Array.isArray(v) ? v.length > 0 : v) cleanTags[k] = v;
  });
  if (Object.keys(cleanTags).length) {
    const existingTags = await sbGet('item-tags') || {};
    existingTags[id] = cleanTags;
    await sbSet('item-tags', existingTags);
    // localStorage
    try {
      const lt = JSON.parse(localStorage.getItem('griette-item-tags-v3') || '{}');
      lt[id] = cleanTags;
      localStorage.setItem('griette-item-tags-v3', JSON.stringify(lt));
    } catch(e) {}
  }
  pf.style.width = '80%';

  // 4. Foto-URL opslaan
  if (photoUrl) {
    const photos = await sbGet('cloud-photos') || {};
    photos[id] = photoUrl;
    await sbSet('cloud-photos', photos);
    try {
      const lsp = JSON.parse(localStorage.getItem('griette-cloud-photos-v1') || '{}');
      lsp[id] = photoUrl;
      localStorage.setItem('griette-cloud-photos-v1', JSON.stringify(lsp));
    } catch(e) {}
  }

  // 5. localStorage custom-items
  try {
    const lsi = JSON.parse(localStorage.getItem('griette-custom-items-v3') || '{}');
    if (!lsi[selectedCat]) lsi[selectedCat] = [];
    lsi[selectedCat].push({ id, name, ...(desc ? {beschrijving: desc} : {}) });
    localStorage.setItem('griette-custom-items-v3', JSON.stringify(lsi));
  } catch(e) {}

  pf.style.width = '100%';
  sm.textContent = '';

  setTimeout(() => {
    document.getElementById('form-area').style.display  = 'none';
    document.getElementById('bottom-bar').style.display = 'none';
    const ss = document.getElementById('success-screen');
    ss.style.display = 'flex';
    document.getElementById('success-name').textContent = name + ' · ' + CATS.find(c => c.id === selectedCat)?.label;
  }, 300);
}

function resetForm() {
  selectedFile = null;
  selectedCat  = null;
  Object.keys(tags).forEach(k => delete tags[k]);

  document.getElementById('preview-img').src = '';
  document.getElementById('photo-zone').classList.remove('has-photo');
  document.getElementById('file-camera').value  = '';
  document.getElementById('file-gallery').value = '';
  document.getElementById('item-name').value = '';
  document.getElementById('item-desc').value  = '';
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('tags-area').innerHTML = '';
  document.getElementById('save-btn').disabled = true;
  document.getElementById('prog-bar').style.display = 'none';
  document.getElementById('prog-fill').style.width = '0';
  document.getElementById('status-msg').textContent = '';

  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('form-area').style.display      = 'flex';
  document.getElementById('bottom-bar').style.display     = 'flex';
}
</script>
</body>
</html>
