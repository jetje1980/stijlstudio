<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c1d26">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
</head>
<body>
<title>Family Crazy Adventskalender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Karla:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: een getekend bordeaux huisje op lichtgrijs papier; elk raampje is een dag, het dakkapelletje is 24 december.
   Bewust één lichte papierwereld, zonder donkere modus. */
:root{
  --papier:#f1f0ec;      /* lichtgrijs tekenpapier */
  --creme:#fbf8f1;       /* envelop, luikjes */
  --inkt:#3b2a26;        /* warm donkerbruin */
  --zacht:#7d6f68;
  --bordeaux:#7c1d26; --bordeaux-donker:#5e141c;
  --goud:#b8924a; --goud-licht:#d8bd7e;
  --rood:#c22a33;        /* handgeschreven cijfers, lakzegel */
  --den:#2f5a47;         /* dennengroen */
  --nacht:#1c2742;       /* ramen van binnen */
  --kraft:#d3b48a;
  --hout:#8a5a36;
  --f-titel:"Fraunces",Georgia,serif;
  --f-tekst:"Karla",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--papier);color:var(--inkt);font-family:var(--f-tekst);font-size:16px;line-height:1.5;
  background-image:radial-gradient(rgba(59,42,38,.035) 1px,transparent 1.2px);background-size:5px 5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--rood);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative}
h1,h2,h3{font-family:var(--f-titel);font-weight:400;text-wrap:balance;margin:0}
.kapitaal{font-family:var(--f-titel);text-transform:uppercase;letter-spacing:.14em;font-size:13px}
.hand{font-family:var(--f-hand)}
.demo{display:inline-block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--goud);color:var(--goud);padding:2px 9px;border-radius:99px;background:var(--creme)}
.takje{position:absolute;pointer-events:none;width:120px;opacity:.95}

/* ---------- inloggen: cadeaulabels aan een touwtje ---------- */
.login{display:grid;gap:20px;padding-top:8px}
.login h1{font-size:clamp(32px,8vw,46px);line-height:1.08;color:var(--bordeaux)}
.login h1 em{font-family:var(--f-hand);font-style:normal;color:var(--rood);font-size:1.15em}
.login p{margin:0;color:var(--zacht);max-width:34em}
.touw{position:relative;padding-top:18px}
.touw::before{content:"";position:absolute;left:-8px;right:-8px;top:8px;height:2px;background:repeating-linear-gradient(90deg,var(--goud) 0 6px,var(--goud-licht) 6px 9px);border-radius:2px}
.mensen{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.label{border:0;background:none;padding:0;display:grid;justify-items:center;transform-origin:50% 0;transition:transform .3s}
.label:nth-child(odd){transform:rotate(-3deg)} .label:nth-child(even){transform:rotate(2.5deg)}
.label:hover{transform:rotate(0) translateY(3px)}
.label .draad{width:1px;height:18px;background:var(--inkt);opacity:.6}
.label .kaartje{width:100%;max-width:120px;padding:22px 8px 14px;display:grid;justify-items:center;gap:2px;
  clip-path:polygon(18% 0,82% 0,100% 16%,100% 100%,0 100%,0 16%);box-shadow:0 6px 10px -6px rgba(0,0,0,.4);position:relative}
.label .kaartje::before{content:"";position:absolute;top:8px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--papier);box-shadow:0 0 0 2px var(--goud)}
.label .naam{font-family:var(--f-hand);font-size:26px;line-height:1;color:var(--inkt)}
.label small{font-size:11px;color:var(--zacht);letter-spacing:.06em;text-transform:uppercase}
.pin{background:var(--creme);border-radius:3px;padding:22px;display:grid;gap:12px;max-width:340px;box-shadow:0 12px 30px -14px rgba(59,42,38,.45);border-top:3px solid var(--bordeaux)}
.pin h3{font-family:var(--f-hand);font-size:30px;color:var(--bordeaux)}
.pin input{font-size:28px;letter-spacing:.5em;text-align:center;padding:8px;border:1px solid var(--goud-licht);border-radius:3px;background:#fff;width:100%;font-variant-numeric:tabular-nums}
.knop{border:0;background:var(--bordeaux);color:var(--creme);padding:10px 18px;border-radius:2px;font-family:var(--f-titel);text-transform:uppercase;letter-spacing:.12em;font-size:13px}
.knop.licht{background:transparent;color:var(--bordeaux);box-shadow:inset 0 0 0 1px var(--bordeaux)}
.fout{color:var(--rood);font-size:14px;min-height:1.2em;margin:0}
.uitleg{font-size:14px;color:var(--zacht);margin:0}

/* ---------- het huisje ---------- */
.kop{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.kop h1{font-size:clamp(28px,7vw,40px);color:var(--bordeaux);line-height:1.05}
.kop .wie{font-family:var(--f-hand);font-size:24px;color:var(--rood);line-height:1}
.balk{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tijd{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:16px;flex-wrap:wrap;border-top:1px dashed var(--goud-licht);border-bottom:1px dashed var(--goud-licht);padding-block:8px}
.tijd input{flex:1;min-width:140px;accent-color:var(--bordeaux)}

.huis{position:relative;max-width:440px;margin:0 auto;filter:drop-shadow(0 22px 22px rgba(59,42,38,.25))}
.dak{position:relative;aspect-ratio:2.1/1;margin:0 -4%;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:
    linear-gradient(transparent 92%,var(--creme) 92%),
    repeating-linear-gradient(0deg,var(--goud) 0 2px,transparent 2px 16px),
    repeating-linear-gradient(90deg,var(--goud) 0 2px,transparent 2px 26px),
    #e1c99b}
.dak::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 16px,rgba(255,255,255,.0) 16px);}
.dakvak{position:relative}
.kapel{position:absolute;left:50%;bottom:8%;width:22%;transform:translateX(-50%);z-index:2}
.gevel{position:relative;background:var(--bordeaux);padding:16px 14px 0;
  background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(rgba(255,255,255,.6) .8px,transparent 1.3px);
  background-size:38px 34px,23px 27px;background-position:0 0,11px 7px;
  box-shadow:inset 0 3px 0 var(--goud),inset 0 6px 0 var(--bordeaux-donker)}
.slinger{display:block;width:100%;height:30px;margin:-4px 0 6px}
.ramen{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 10px;padding-bottom:0}
.sneeuw{height:18px;background:var(--creme);margin:0 -14px;
  -webkit-mask:radial-gradient(circle at 10px 0,#000 10px,transparent 10.5px) 0 0/20px 100% repeat-x,linear-gradient(#000 0 0) 0 100%/100% 55% no-repeat;
  mask:radial-gradient(circle at 10px 0,#000 10px,transparent 10.5px) 0 0/20px 100% repeat-x,linear-gradient(#000 0 0) 0 100%/100% 55% no-repeat}

/* een raampje */
.raam{position:relative;border:0;padding:0;background:none;aspect-ratio:3/4;display:block;width:100%}
.raam .glas{position:absolute;inset:0;border:2px solid var(--goud);background:var(--creme);overflow:hidden;
  box-shadow:inset 0 0 0 3px var(--creme),inset 0 0 0 4px var(--goud-licht)}
.raam.boog .glas{border-radius:50% 50% 3px 3px/34% 34% 3px 3px}
.raam.rond{aspect-ratio:1/1;align-self:center}
.raam.rond .glas{border-radius:50%}
.raam.deur{grid-column:span 2;aspect-ratio:auto;min-height:100%}
.raam.deur .glas{border-radius:50% 50% 0 0/22% 22% 0 0;border-bottom:0}
.raam .roede{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,transparent calc(50% - 1px),var(--goud-licht) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
             linear-gradient(transparent calc(42% - 1px),var(--goud-licht) calc(42% - 1px) calc(42% + 1px),transparent calc(42% + 1px));opacity:.7}
.raam.rond .roede,.raam.deur .roede{opacity:.35}
.raam .vensterbank{position:absolute;left:-6%;right:-6%;bottom:-6px;height:5px;background:var(--goud);border-radius:1px}
.raam.deur .vensterbank,.raam.rond .vensterbank{display:none}
.raam .nr{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;color:var(--rood);
  font-size:clamp(28px,8vw,40px);line-height:1;text-shadow:0 0 6px var(--creme),0 0 2px var(--creme)}
.raam:disabled{cursor:default}
.raam:disabled .nr{opacity:.45}
.raam:not(:disabled):hover .glas{transform:translateY(-2px)}
.raam .glas{transition:transform .25s}
.raam .stip{position:absolute;right:6px;top:22%;width:7px;height:7px;border-radius:50%;background:var(--rood);box-shadow:0 0 0 2px var(--creme)}
.raam.vandaag .glas{animation:gloed 2.4s ease-in-out infinite}
@keyframes gloed{50%{box-shadow:inset 0 0 0 3px var(--creme),inset 0 0 0 4px var(--goud-licht),0 0 16px 4px rgba(242,214,140,.85)}}
/* open raampje: het licht is aan */
.raam.open .glas{background:radial-gradient(ellipse at 50% 100%,rgba(246,196,107,.75),transparent 62%),var(--nacht);box-shadow:inset 0 0 0 3px var(--nacht),inset 0 0 0 4px var(--goud)}
.raam.open .nr{inset:auto auto 4px 6px;display:block;font-size:20px;color:var(--goud-licht);text-shadow:none}
.raam.open .mini{position:absolute;inset:24% 16% 26%;display:grid;place-items:center}
.raam.open .mini svg{width:100%;height:100%}
.legenda{font-size:13px;color:var(--zacht);margin-top:22px;text-align:center}

/* ---------- open-moment ---------- */
.scherm{position:fixed;inset:0;background:rgba(43,18,20,.6);display:grid;place-items:center;z-index:20;overflow:auto;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.vel{background:var(--creme);width:min(440px,100%);border-radius:2px;padding:22px;position:relative;display:grid;gap:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.55);border-top:4px solid var(--bordeaux)}
.vel h2{font-family:var(--f-hand);font-size:34px;color:var(--bordeaux);line-height:1}
.sluit{position:absolute;right:10px;top:8px;border:0;background:none;font-size:28px;line-height:1;color:var(--zacht)}
.krasvak{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--creme);touch-action:none;border:2px solid var(--goud)}
.krasvak canvas{position:absolute;inset:0;width:100%;height:100%}
.krasvak .onder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--bordeaux)}
.pakket{aspect-ratio:4/3;display:grid;place-items:center;position:relative;user-select:none;background:radial-gradient(var(--papier),var(--creme))}
.pakket button{border:0;background:none;padding:0;width:62%;transition:transform .15s}
.pakket.schud button{animation:schud .35s}
@keyframes schud{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* onthulling: geanimeerde miniatuurscène op een houten tafel */
.scene{position:relative;aspect-ratio:4/3;overflow:hidden;
  background:repeating-linear-gradient(94deg,#7d4f2e 0 22px,#8a5a36 22px 46px,#74472a 46px 49px,#93633e 49px 80px)}
.scene .env{position:absolute;left:50%;top:38%;width:72%;margin-left:-36%;animation:schuifin .7s cubic-bezier(.2,.8,.3,1.2) both;filter:drop-shadow(0 8px 8px rgba(0,0,0,.35))}
.scene .tag{position:absolute;right:6%;top:6%;width:26%;transform:rotate(18deg);animation:schuifin .7s .2s cubic-bezier(.2,.8,.3,1.2) both;filter:drop-shadow(0 4px 5px rgba(0,0,0,.3))}
.scene .takje2{position:absolute;left:-4%;bottom:-6%;width:40%;transform:rotate(-20deg)}
.scene .briefje{position:absolute;left:50%;top:30%;width:54%;margin-left:-27%;background:#fffdf7;padding:12px 12px;
  font-family:var(--f-hand);font-size:22px;line-height:1.1;text-align:center;color:var(--inkt);box-shadow:0 6px 14px rgba(0,0,0,.3);
  animation:omhoog .9s 1s cubic-bezier(.2,.8,.3,1.1) both;
  -webkit-mask:linear-gradient(#000 0 0) 0 4px/100% calc(100% - 8px) no-repeat,radial-gradient(circle at 4px 4px,#000 3.5px,transparent 4px) 0 0/8px 8px repeat-x,radial-gradient(circle at 4px 4px,#000 3.5px,transparent 4px) 0 100%/8px 8px repeat-x;
  mask:linear-gradient(#000 0 0) 0 4px/100% calc(100% - 8px) no-repeat,radial-gradient(circle at 4px 4px,#000 3.5px,transparent 4px) 0 0/8px 8px repeat-x,radial-gradient(circle at 4px 4px,#000 3.5px,transparent 4px) 0 100%/8px 8px repeat-x}
.scene .zegel{transform-origin:60px 46px;animation:breek .5s .6s ease-in both}
.scene .ster{position:absolute;top:0;width:9px;height:9px;animation:dwarrel 3s linear infinite}
@keyframes schuifin{from{transform:translateY(140%) rotate(-10deg)}}
@keyframes breek{to{transform:scale(1.4) rotate(30deg);opacity:0}}
@keyframes omhoog{from{transform:translateY(70%) scale(.5);opacity:0}to{transform:translateY(-20%) rotate(-3deg);opacity:1}}
@keyframes dwarrel{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(360px) rotate(360deg)}}
.items{display:grid;gap:12px}
.item{border-left:2px solid var(--goud);padding:2px 0 4px 12px}
.item .soort{font-family:var(--f-titel);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--zacht)}
.item .tekst{font-family:var(--f-hand);font-size:26px;line-height:1.15;white-space:pre-wrap}
.item a{color:var(--bordeaux);font-weight:600}
.item img{margin-top:6px;border:6px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15);transform:rotate(-1.5deg)}
.voorIedereen{display:inline-block;background:var(--den);color:var(--creme);font-family:var(--f-tekst);font-size:10px;padding:1px 8px;border-radius:99px;margin-left:6px;letter-spacing:.06em}

/* ---------- beheer ---------- */
.beheer{display:grid;gap:16px}
.paneel{background:var(--creme);padding:18px;display:grid;gap:12px;min-width:0;box-shadow:0 1px 0 rgba(0,0,0,.05);border-top:2px solid var(--goud)}
.paneel h2{font-family:var(--f-hand);font-size:28px;color:var(--bordeaux);line-height:1}
label{display:grid;gap:4px;font-size:13px;color:var(--zacht)}
input[type=text],input[type=url],select,textarea{font:inherit;color:var(--inkt);padding:8px 10px;border:1px solid var(--goud-licht);border-radius:2px;background:#fff;width:100%}
textarea{min-height:90px;font-family:var(--f-hand);font-size:24px;line-height:1.15}
.rij{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dagkiezer{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.dagkiezer button{border:1px solid var(--goud-licht);background:#fff;border-radius:2px;padding:4px 0;position:relative;font-family:var(--f-hand);font-size:20px;color:var(--rood);line-height:1.2}
.dagkiezer button.aan{background:var(--bordeaux);color:var(--creme);border-color:var(--bordeaux)}
.dagkiezer button .n{position:absolute;right:2px;top:0;font-family:var(--f-tekst);font-size:9px;color:var(--den)}
.dagkiezer button.aan .n{color:var(--goud-licht)}
.lijst{display:grid;gap:8px}
.regel{display:flex;gap:10px;align-items:start;justify-content:space-between;border-bottom:1px dashed var(--goud-licht);padding-bottom:8px}
.regel div{min-width:0;overflow-wrap:anywhere}
.regel button{border:0;background:none;color:var(--rood);font-size:13px;flex:none}
.leden{display:grid;gap:8px}
.lid{display:grid;grid-template-columns:1fr 72px auto;gap:8px;align-items:center}
.melding{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bordeaux);color:var(--creme);padding:8px 16px;border-radius:2px;font-size:14px;z-index:30}

/* ---------- uitknippoppetjes ---------- */
.pop{--m:40px;display:inline-grid;justify-items:center;flex:none}
.pop .hoofd{width:var(--m);height:calc(var(--m)*1.18);border-radius:48% 48% 40% 40%;overflow:hidden;background:var(--kraft);
  box-shadow:0 0 0 3px #fff,0 4px 6px rgba(0,0,0,.25);display:grid;place-items:center;font-family:var(--f-hand);font-weight:700;font-size:calc(var(--m)*.62);color:var(--bordeaux)}
.pop img{width:100%;height:100%;object-fit:cover;display:block}
.pop .stokje{width:3px;height:calc(var(--m)*.45);background:#c9a27a;border-radius:2px;margin-top:3px}
.label .pop{margin-bottom:6px}

/* ---------- stoepje voor het huis: lantaarn, wie er al was, brievenbus ---------- */
.stoep{max-width:440px;margin:0 auto;display:flex;align-items:end;justify-content:space-between;gap:6px;padding:12px 4px 10px;border-bottom:3px solid #d9d3c8;position:relative}
.stoep .wie-al{display:flex;align-items:end;gap:6px;flex-wrap:wrap;justify-content:center;flex:1;min-width:0}
.stoep .wie-al .pop{--m:28px;transition:opacity .3s,filter .3s}
.stoep .wie-al .pop.weg{opacity:.35;filter:grayscale(1)}
.lantaarn{width:38px;flex:none}
.lantaarn .licht{fill:#5b5f6e;transition:fill .4s}
.lantaarn.aan .licht{fill:#ffd977}
.lantaarn.aan{filter:drop-shadow(0 0 10px rgba(255,210,110,.9))}
.bus{border:0;background:none;padding:0;width:58px;flex:none;position:relative}
.bus .vlag{transform-origin:47px 20px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.bus.post .vlag{transform:rotate(-80deg)}
.bus .teller{position:absolute;right:-4px;top:-4px;background:var(--rood);color:#fff;font-size:11px;font-weight:600;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.samen{text-align:center;font-family:var(--f-hand);font-size:22px;color:var(--bordeaux);margin:8px 0 0;line-height:1.1}

/* ---------- spelletjes met miniaturen ---------- */
.spel{position:relative;aspect-ratio:4/3;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid var(--goud)}
.spel.muur{background:var(--bordeaux);background-image:radial-gradient(rgba(216,189,126,.55) 1.2px,transparent 1.8px);background-size:22px 22px}
.spel.zolder{background:linear-gradient(#efe7da,#e3d6c2)}
.spel .vloer{position:absolute;inset:auto 0 0;height:22%;background:repeating-linear-gradient(90deg,#c9a77c 0 38px,#bf9d70 38px 40px)}
.kledje{position:absolute;width:19%;transform:translate(-50%,-50%);cursor:grab;transition:left .25s,top .25s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));touch-action:none}
.kledje.sleep{transition:none;cursor:grabbing;z-index:3}
.kledje .knijper{display:none;position:absolute;left:50%;top:-14%;width:12%;height:30%;margin-left:-6%;background:#f6efe3;border:1px solid #cdbfa8;border-radius:2px}
.kledje.hangt .knijper{display:block}
.kledje.hangt{animation:zwaai 2.4s ease-in-out infinite;transform-origin:50% 0}
@keyframes zwaai{0%,100%{transform:translate(-50%,-10%) rotate(-4deg)}50%{transform:translate(-50%,-10%) rotate(4deg)}}
.mand{position:absolute;left:50%;bottom:6%;width:46%;transform:translateX(-50%);border:0;background:none;padding:0}
.mand.schud{animation:schud .3s}
.vlieg{position:absolute;left:50%;top:60%;width:16%;pointer-events:none;animation:vlieg 1s ease-out forwards}
@keyframes vlieg{to{transform:translate(var(--dx),-160%) rotate(var(--rot));opacity:0}}
.gevonden{position:absolute;left:50%;top:44%;width:22%;transform:translate(-50%,-50%);animation:rijs 1s cubic-bezier(.2,.9,.3,1.3) both;filter:drop-shadow(0 0 14px rgba(255,214,120,.95))}
@keyframes rijs{from{transform:translate(-50%,40%) scale(.3);opacity:0}}
.deurvak{position:absolute;left:50%;bottom:0;width:38%;height:78%;transform:translateX(-50%);perspective:600px}
.deurvak .achter{position:absolute;inset:0;border-radius:50% 50% 0 0/26% 26% 0 0;background:radial-gradient(ellipse at 50% 80%,#ffe3a1,#f4b860 45%,#6e3a1e);display:grid;place-items:center}
.deurvak .achter svg{width:60%}

function naarDocs(st){
  const m=new Map(), zet=(col,id,data)=>m.set(col+"/"+id,{col,id:String(id),data});
  for(const col of LIJSTEN) (st[col]||[]).forEach((x,i)=>{
    x.id ||= uid();
    if(col==="leden"||col==="inhoud") x.volgorde=i; else x.t ??= Date.now()+i;
    zet(col, x.id, x);
  });
  Object.entries(st.geopend||{}).forEach(([k,v])=>zet("geopend",k,{dagen:v}));
  Object.entries(st.reacties||{}).forEach(([it,per])=>Object.entries(per||{}).forEach(([l,v])=>zet("reacties",it+"|"+l,v)));
  Object.entries(st.scores||{}).forEach(([k,v])=>zet("scores",k,{n:v}));
  Object.entries(st.gespeeld||{}).forEach(([k,v])=>zet("gespeeld",k,{i:v}));
  Object.entries(st.ingewisseld||{}).forEach(([k,v])=>zet("ingewisseld",k,{op:v}));
  zet("config","menu",{tekst:st.menu||""});
  return m;
}
function vanDocs(docs){
  const st={leden:[],inhoud:[],post:[],wensen:[],ideeen:[],taken:[],dinerwensen:[],diner:[],geopend:{},reacties:{},scores:{},gespeeld:{},ingewisseld:{},menu:"",lootjes:null,lootjeOpen:{}};
  for(const {col,id,data} of docs){
    if(LIJSTEN.includes(col)) st[col].push({...data,id});
    else if(col==="geopend") st.geopend[id]=data.dagen||[];
    else if(col==="reacties"){ const [it,l]=id.split("|"); (st.reacties[it] ||= {})[l]=data; }
    else if(col==="scores") st.scores[id]=data.n||0;
    else if(col==="gespeeld") st.gespeeld[id]=data.i||[];
    else if(col==="ingewisseld") st.ingewisseld[id]=data.op;
    else if(col==="config"&&id==="menu") st.menu=data.tekst||"";
  }
  for(const col of LIJSTEN) st[col].sort((a,b)=>(a.volgorde??a.t??0)-(b.volgorde??b.t??0));
  return st;
}

  if(!r.ok) throw Object.assign(new Error(j.fout||"Er ging iets mis."),{status:r.status});
  return j;
}

    if(!upserts.length && !deletes.length) return;
    const res=await api("schrijf",{upserts,deletes});
    for(const d of upserts) SNAP.set(d.col+"/"+d.id, zonderPinJson(d));

  SNAP=new Map([...naarDocs(S)].map(([k,d])=>[k,JSON.stringify(d.data)]));
  ik=S.leden.find(l=>l.id===j.ik)||null;
  demoDag = ik && ik.beheer ? (demoDag || VANDAAG || 1) : VANDAAG;
}
async function haalLeden(){
  const j=await api("leden");
  ONLINE=true; VANDAAG=j.vandaag; LEEG=j.leeg;
  S=vanDocs([]); S.leden=j.leden.sort((a,b)=>a.volgorde-b.volgorde);
}
async function startOnline(){
  try{ await haalLeden(); }catch(e){ ONLINE=false; return; }   /* geen server bereikbaar: dan is dit de demo */
  try{ TOKEN=localStorage.getItem("familycrazy-token"); }catch(e){}

}

});

/* ===== Een raampje openen ===== */
let V=null;
function openDag(dag){
  V = venster(`${dag} december`);
  if(geopend(dag)) return onthul(dag,false);
  (SPEL[spelVan(dag)]||SPEL.kras)(dag);
}
function markeer(dag){ (S.geopend[ik.id] ||= []); if(!geopend(dag)) S.geopend[ik.id].push(dag); bewaar(); }
function klaar(dag,wacht){ markeer(dag); setTimeout(()=>onthul(dag,true), wacht??350); }
const SPEL = {
  kras: d=>krassen(d,"goud"), sneeuw: d=>krassen(d,"sneeuw"),
  lintje: uitpakken, waslijn, wasmand, deurtje, laatjes
};

function krassen(dag, soort){
  const p=V.podium, sneeuw = soort==="sneeuw";
  const voetjes = sneeuw ? `<svg viewBox="0 0 100 75" style="position:absolute;inset:0;width:100%;height:100%">${Array.from({length:11},(_,i)=>{const x=10+i*7.6,y=66-i*5.2+(i%2?3.5:-3.5);return `<g transform="translate(${x} ${y}) rotate(${-35})"><ellipse rx="1.8" ry="3.2" fill="#7a5a44" opacity=".75"/><circle cx="-1" cy="-4.4" r=".6" fill="#7a5a44"/><circle cx=".3" cy="-4.7" r=".6" fill="#7a5a44"/><circle cx="1.4" cy="-4.2" r=".55" fill="#7a5a44"/></g>`}).join("")}<g transform="translate(92 10)">${SVG.cadeau.replace('<svg viewBox="0 0 60 44"','<svg x="-8" y="-6" width="16" height="12" viewBox="0 0 60 44"')}</g></svg>` : "";
  p.innerHTML=`<div class="krasvak" style="${sneeuw?'background:repeating-linear-gradient(94deg,#a98a6c 0 22px,#b39474 22px 46px,#9c7e61 46px 48px)':''}"><div class="onder">${voetjes}${sneeuw?'':'<div class="hand" style="font-size:32px">wat zou het zijn…</div>'}</div><canvas></canvas></div>
    <p class="spel-uitleg">${sneeuw?"Veeg met het bezempje de sneeuw weg en volg de voetstapjes.":"Kras met je vinger het goudpapier weg."}</p>`;
  const c=p.querySelector("canvas"), vak=p.querySelector(".krasvak");
  const r=vak.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  if(sneeuw){
    const gr=x.createLinearGradient(0,0,0,r.height); gr.addColorStop(0,"#ffffff"); gr.addColorStop(1,"#e4ecf2");
    x.fillStyle=gr; x.fillRect(0,0,r.width,r.height);
    for(let i=0;i<160;i++){ x.fillStyle=i%4?"rgba(190,205,220,.5)":"rgba(216,189,126,.6)"; x.beginPath(); x.arc(Math.random()*r.width,Math.random()*r.height,Math.random()*1.6+.4,0,7); x.fill(); }
  } else {
    const gr=x.createLinearGradient(0,0,r.width,r.height); gr.addColorStop(0,"#c9a45e"); gr.addColorStop(.5,"#e6cf98"); gr.addColorStop(1,"#b38a42");
    x.fillStyle=gr; x.fillRect(0,0,r.width,r.height);
    for(let i=0;i<120;i++){ x.fillStyle=i%2?"rgba(255,255,255,.55)":"rgba(124,29,38,.35)"; x.beginPath(); x.arc(Math.random()*r.width,Math.random()*r.height,Math.random()*1.8+.5,0,7); x.fill(); }
    x.fillStyle="#c22a33"; x.font="700 84px Caveat, cursive"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(dag,r.width/2,r.height/2);
  }
  x.globalCompositeOperation="destination-out"; x.lineCap="round"; x.lineWidth=sneeuw?48:34;
  let bezig=false, vorige=null, af=false;
  const punt=e=>{ const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  c.onpointerdown=e=>{ bezig=true; vorige=punt(e); c.setPointerCapture(e.pointerId); };
  c.onpointerup=c.onpointercancel=()=>{ bezig=false; check(); };
  c.onpointermove=e=>{ if(!bezig||af) return; const n=punt(e); x.beginPath(); x.moveTo(...vorige); x.lineTo(...n); x.stroke(); vorige=n; };
  function check(){
    const d=x.getImageData(0,0,c.width,c.height).data; let leeg=0;
    for(let i=3;i<d.length;i+=64) if(d[i]===0) leeg++;
    if(leeg/(d.length/64)>.5 && !af){ af=true; c.style.transition="opacity .6s"; c.style.opacity=0; klaar(dag, sneeuw?1400:350); }
  }
}

/* Waslijn: hang de drie kerstkleertjes op met een knijper */
function waslijn(dag){
  const p=V.podium;
  const plek=[[28,33],[50,38],[72,34]], start=[[20,78],[50,80],[80,78]], namen=["sok","pakje","muts"];
  p.innerHTML=`<div class="spel zolder" id="lijn">
      <svg viewBox="0 0 100 75" style="position:absolute;inset:0;width:100%;height:100%" preserveAspectRatio="none">
        <rect x="9" y="12" width="2" height="50" fill="#e2cfa8"/><rect x="89" y="16" width="2" height="46" fill="#e2cfa8"/>
        <ellipse cx="10" cy="62" rx="6" ry="2.2" fill="#8a5a36"/><ellipse cx="90" cy="62" rx="6" ry="2.2" fill="#8a5a36"/>
        <path d="M10 14Q50 30 90 18" fill="none" stroke="#fff" stroke-width=".7"/><path d="M10 14Q50 30 90 18" fill="none" stroke="#cdbfa8" stroke-width=".25"/>
      </svg>
      ${namen.map((n,i)=>`<div class="kledje" data-i="${i}" style="left:${start[i][0]}%;top:${start[i][1]}%"><span class="knijper"></span>${KLEREN[n]}</div>`).join("")}
    </div><p class="spel-uitleg">Sleep de kerstkleertjes naar de waslijn, of tik erop.</p>`;
  const vak=$("#lijn"); const bezet=[false,false,false]; let hangend=0;
  const hang=(el)=>{ if(el.classList.contains("hangt")) return; const i=bezet.findIndex(b=>!b); if(i<0) return; bezet[i]=true;
    el.style.left=plek[i][0]+"%"; el.style.top=plek[i][1]+"%"; el.classList.add("hangt"); hangend++;
    if(hangend===3){ $(".spel-uitleg").textContent="Alles hangt te drogen!"; klaar(dag,1100); } };
  vak.querySelectorAll(".kledje").forEach(el=>{
    let sx,sy,bewogen=false;
    el.onpointerdown=e=>{ if(el.classList.contains("hangt")) return; el.setPointerCapture(e.pointerId); el.classList.add("sleep"); sx=e.clientX; sy=e.clientY; bewogen=false; };
    el.onpointermove=e=>{ if(!el.classList.contains("sleep")) return; if(Math.hypot(e.clientX-sx,e.clientY-sy)>6) bewogen=true;
      const b=vak.getBoundingClientRect(); el.style.left=((e.clientX-b.left)/b.width*100)+"%"; el.style.top=((e.clientY-b.top)/b.height*100)+"%"; };
    el.onpointerup=e=>{ if(!el.classList.contains("sleep")) return; el.classList.remove("sleep");
      const b=vak.getBoundingClientRect(), y=(e.clientY-b.top)/b.height*100;
      if(!bewogen || y<52) hang(el); else { const i=+el.dataset.i; el.style.left=start[i][0]+"%"; el.style.top=start[i][1]+"%"; } };
  });
}

    </div><p class="spel-uitleg" id="tel">In welk laatje zit het? Kies er één.</p>`;
  p.querySelectorAll(".la").forEach(la=>la.onclick=()=>{

/* ===== Stopmotion ===== */
const framesVan = it => it.frames||[];  /* eigen foto's; de kant-en-klare clips zijn filmpjes in films/ */
function startFilms(root){
  clearInterval(filmTimer);
  const films=[...root.querySelectorAll(".film")]; if(!films.length) return;
  const st=films.map(f=>({f, fr:framesVan(S.inhoud.find(x=>x.id===f.dataset.id)||{}), i:0, aan:true}));
  st.forEach(s=>s.fr.forEach(src=>{ const im=new Image(); im.src=src; }));
  st.forEach(s=>s.f.querySelector(".speel").onclick=()=>{ s.aan=!s.aan; s.f.querySelector(".speel").textContent=s.aan?"Pauze":"Speel"; });
  filmTimer=setInterval(()=>st.forEach(s=>{ if(!s.aan||!s.fr.length) return; s.i=(s.i+1)%s.fr.length; const img=s.f.querySelector("img"); img.src=s.fr[s.i];
    img.style.transform=`translate(${(Math.random()-.5)*1.5}px,${(Math.random()-.5)*1.5}px)`; }),125);
}

/* ===== Onthulling ===== */
function onthul(dag,nieuw){
  const l=voorMij(dag), p=V.podium, eerste=l[0];
  const film=l.find(x=>x.soort==="stopmotion"||x.soort==="film");
  const kop = eerste ? kort((eerste.tekst||SOORTEN[eerste.soort]).split("\n")[0]) : "Nog even geduld…";
  const sterren = nieuw ? Array.from({length:16},(_,i)=>`<svg class="ster" viewBox="0 0 10 10" style="left:${Math.random()*100}%;animation-delay:${Math.random()*2.5}s"><path d="M5 0v10M0 5h10M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="${["#fff","#d8bd7e","#fff"][i%3]}" stroke-width="1.2"/></svg>`).join("") : "";
  const kamer = kamerVan(dag);
  const vlokken = BUITEN.includes(kamer) ? Array.from({length:22},()=>`<span class="vlok" style="left:${Math.random()*100}%;width:${3+Math.random()*4}px;height:${3+Math.random()*4}px;animation-duration:${5+Math.random()*6}s;animation-delay:${-Math.random()*10}s"></span>`).join("") : "";
  const scene = film ? "" : `<div class="kamer"><img src="kamers/${kamer}.jpg" alt="${esc(KAMERS[kamer])}"><span class="gloed"></span>${vlokken}${sterren}
      <div class="labelkaart"><span class="lint"></span><svg class="strik" viewBox="0 0 40 20"><path d="M20 8q-14-12-16 0t16 0q14-12 16 0t-16 0" fill="#7c1d26"/><circle cx="20" cy="8" r="3" fill="#5e141c"/></svg><div class="kaart">${esc(kop)}</div></div>
    </div>`;
  p.innerHTML=`${scene}
    <div class="items">${l.length? l.map(it=>{
      if(it.soort==="bon") return bonHtml(it);
      if(it.soort==="uitje") return uitjeHtml(it);
      if(it.soort==="games") return gamesHtml(it);
      if(it.soort==="lootje") return `<div class="item"><div class="tekst">${esc(it.tekst)}</div></div>${lootjeHtml()}`;
      return `<div class="item">
        <div class="soort">${SOORTEN[it.soort]}${it.voor==="alle"?'<span class="voorIedereen">voor iedereen</span>':''}</div>
        ${it.soort==="film"&&FILMS[it.film]?`<div class="sfeerfilm"><video src="films/film-${it.film}.mp4" poster="films/film-${it.film}.jpg" autoplay muted loop playsinline controls aria-label="${esc(FILMS[it.film])}"></video></div>`:""}
        ${it.soort==="stopmotion"&&it.clip&&CLIPS[it.clip]?`<div class="sfeerfilm"><video src="films/stop-${it.clip}.mp4" poster="films/stop-${it.clip}.jpg" autoplay muted loop playsinline controls aria-label="${esc(CLIPS[it.clip][0])}"></video></div>`:""}
        ${it.soort==="stopmotion"&&!it.clip?`<div class="film" data-id="${it.id}"><div class="beeld"><img src="${framesVan(it)[0]||""}" alt="Stopmotion-filmpje"><span class="korrel"></span></div><button class="speel">Pauze</button></div>`:""}
        ${it.tekst?`<div class="tekst">${esc(it.tekst)}</div>`:""}
        ${it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">Open ${it.soort==="liedje"?"het liedje":it.soort==="video"?"het filmpje":"de link"} ↗</a>`:""}
        ${it.beeld?`<img src="${esc(it.beeld)}" alt="">`:""}
      </div>`;}).join("") : `<p class="uitleg">Nog leeg. Griëtte is bezig. Niet opjagen.</p>`}
    </div>`;
  startFilms(p); bonKnoppen(p); uitjeKnoppen(p); gamesKnoppen(p); lootjeKnoppen(p, ()=>onthul(dag,false));
  if(dag===25){ const d=document.createElement("div"); d.style.marginTop="18px"; d.innerHTML=dinerHtml(); p.appendChild(d); dinerKnoppen(d, ()=>onthul(dag,false)); }
}

function uitjeKnoppen(root){
  root.querySelectorAll("[data-uitje]").forEach(el=>{ const id=el.dataset.uitje, it=S.inhoud.find(x=>x.id===id);
    const zet=(k,v)=>{ (S.reacties[id] ||= {}); S.reacties[id][ik.id]={...(S.reacties[id][ik.id]||{}),[k]:v}; bewaar(); el.outerHTML=uitjeHtml(it); uitjeKnoppen(root); };
    el.querySelectorAll("[data-keuze]").forEach(b=>b.onclick=()=>zet("keuze",b.dataset.keuze));
    el.querySelector("[data-erbij]").onclick=()=>zet("erbij",!((S.reacties[id]||{})[ik.id]||{}).erbij);

}

/* ===== Crazy Christmas Games (25 december) ===== */
function gamesItem(){
  let it=S.inhoud.find(x=>x.soort==="games");
  if(!it){ it={id:uid(), dag:25, voor:"alle", soort:"games", spel:"deurtje", mini:"cadeau", kamer:"cadeaus", tekst:""}; S.inhoud.push(it); bewaar(); }
  return it;
}
function gamesHtml(it){
  const lijst=(it.tekst||"").split("\n").map(x=>x.trim()).filter(Boolean), gs=S.gespeeld[it.id]||[], leider=spelleider();
  const max=Math.max(0,...S.leden.map(l=>S.scores[l.id]||0));
  const leiders=S.leden.filter(l=>l.spelleider).map(l=>l.naam).join(" en ")||"Griëtte";
  return `<div class="games" data-games="${it.id}">
    <span class="kop2">Spelleider: ${esc(leiders)}</span>
    <div class="spellijst">${lijst.map((g,i)=>leider?`<label><input type="checkbox" data-gespeeld="${i}" ${gs.includes(i)?"checked":""}>${esc(g)}</label>`:`<div>${gs.includes(i)?"✓ ":"· "}${esc(g)}</div>`).join("")||'<p class="uitleg">De spelleider zet de spellen er nog in.</p>'}</div>
    <h3 class="kapitaal">Scorebord</h3>
    <div class="scorebord">${[...S.leden].sort((a,b)=>(S.scores[b.id]||0)-(S.scores[a.id]||0)).map(l=>{ const pt=S.scores[l.id]||0, kop=pt&&pt===max;
      return `<div class="score ${kop?'koploper':''}" style="grid-template-columns:${leider?'auto 1fr auto auto auto':'auto 1fr auto'}">${pop(l,24)}<span>${esc(l.naam)}${kop?' ★':''}</span>${leider?`<button class="plus" data-min="${l.id}" aria-label="Punt eraf voor ${esc(l.naam)}">−</button>`:""}<span class="punten">${pt}</span>${leider?`<button class="plus" data-plus="${l.id}" aria-label="Punt erbij voor ${esc(l.naam)}">+</button>`:""}</div>`;}).join("")}</div>
    ${leider?`<label>Spellen, één per regel<textarea data-spellen>${esc(it.tekst)}</textarea></label><button class="knop klein" data-opslaan>Spellen opslaan</button>`:""}
  </div>`;
}
function gamesKnoppen(root){
  root.querySelectorAll("[data-games]").forEach(el=>{ const it=S.inhoud.find(x=>x.id===el.dataset.games);
    const opnieuw=()=>{ bewaar(); el.outerHTML=gamesHtml(it); gamesKnoppen(root); };
    el.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{ S.scores[b.dataset.plus]=(S.scores[b.dataset.plus]||0)+1; opnieuw(); });
    el.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{ S.scores[b.dataset.min]=Math.max(0,(S.scores[b.dataset.min]||0)-1); opnieuw(); });
    el.querySelectorAll("[data-gespeeld]").forEach(c=>c.onchange=()=>{ const g=new Set(S.gespeeld[it.id]||[]); c.checked?g.add(+c.dataset.gespeeld):g.delete(+c.dataset.gespeeld); S.gespeeld[it.id]=[...g]; opnieuw(); });
    const o=el.querySelector("[data-opslaan]"); if(o) o.onclick=()=>{ it.tekst=el.querySelector("[data-spellen]").value; opnieuw(); melding("Spellen opgeslagen"); };
  });
}

    ${tab==="samen"?ideeenHtml():""}
    ${tab==="diner"?`<div style="margin-top:12px">${dinerHtml()}</div>`:""}`;
  v.podium.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ v.lag.remove(); brievenbus(b.dataset.tab); });
  const herteken=()=>{ v.lag.remove(); brievenbus(tab); };
  lootjeKnoppen(v.podium, herteken); ideeKnoppen(v.podium, herteken); dinerKnoppen(v.podium, herteken);
  const f=$("#busform");
  if(f){
    const wissel=()=>{ const s=$("#ps").value; $("#aanveld").hidden=s!=="briefje"; $("#fotoveld").hidden=s!=="foto";
      $("#pu").textContent={briefje:"Griëtte leest je briefje eerst, dan ligt het de volgende ochtend in hun raampje.",vraag:"Het antwoord vind je straks onder 'Mijn post'. Dan gaat het vlaggetje van de brievenbus omhoog.",foto:"Alle foto's worden op 25 december samen een stopmotion van de maand.",diner:"Griëtte ziet je wens en kiest daarmee het kerstmenu."}[s]; };
    $("#ps").onchange=wissel; wissel();
    f.onsubmit=async e=>{ e.preventDefault();
      const s=$("#ps").value, t=$("#pt").value.trim(), fl=$("#pf").files[0];
      if(!t && !fl){ melding("Schrijf eerst iets."); return; }
      if(s==="diner"){ S.dinerwensen.push({id:uid(), van:ik.id, tekst:t}); }
      else S.post.push({id:uid(), van:ik.id, aan:s==="briefje"?$("#pa").value:null, soort:s, tekst:t, beeld:fl?await verklein(fl,500):null, status:"nieuw", dag:demoDag});
      bewaar(); v.lag.querySelector(".vel").classList.add("plof");
      setTimeout(()=>{ v.dicht(); melding("Plof. Zit erin. Terugvragen kan niet."); },650);
    };
  }
}

/* ===== Beheer ===== */
function tekenBeheer(){
  const tel = d => S.inhoud.filter(x=>x.dag===d).length;
  const vanDag = S.inhoud.filter(x=>x.dag===beheerDag);
  const naam = id => id==="alle" ? "Iedereen" : lid(id).naam;
  const post = [...S.post].sort((a,b)=>(a.status==="nieuw"?0:1)-(b.status==="nieuw"?0:1));
  const ingewisseld = Object.entries(S.ingewisseld).map(([k,op])=>{ const [id,wie]=k.split("|"); const it=S.inhoud.find(x=>x.id===id); return it?{it,wie,op}:null; }).filter(Boolean);
  $("#app").innerHTML=`
  <header class="kop"><div><div class="wie">achter de schermen</div><h1>Beheer</h1></div>
    <div class="balk"><button class="knop" id="terug">Naar het huisje</button></div></header>
  <div class="beheer">
    <section class="paneel" id="gezin"><h2>Gezinsleden</h2>
      <p class="uitleg">Vul hier de namen en pincodes in${ONLINE?" (een pincode zie je niet terug; vul alleen een nieuwe in als je hem wilt veranderen)":""}. Tik op een poppetje om er een foto van te maken.</p>
      <form id="gezinform" style="display:grid;gap:8px">
        ${S.leden.map((l,i)=>`<div class="lidkaart">
          <label class="lidfoto" title="Foto kiezen">${pop(l,34)}<input type="file" accept="image/*" data-foto="${i}" hidden></label>
          <label>Naam<input type="text" id="naam-${l.id}" value="${esc(l.naam)}" data-i="${i}" data-v="naam" autocomplete="off"></label>
          <label>Pincode<input type="text" id="pin-${l.id}" value="${esc(l.pin)}" placeholder="${ONLINE?'nieuw?':''}" data-i="${i}" data-v="pin" maxlength="4" inputmode="numeric" autocomplete="off"></label>
          <div class="lid-acties">${l.beheer?'<span class="status">beheerder</span>':`${l.spelleider?'<span class="status">spelleider</span>':''}<button class="mini-weg" type="button" data-reset="${l.id}">ramen weer dicht</button><button class="mini-weg" type="button" data-lidweg="${l.id}">verwijderen</button>`}</div>
        </div>`).join("")}
        <div class="balk"><button class="knop">Namen opslaan</button><button class="knop licht" id="erbij" type="button">+ Gezinslid erbij</button></div>
      </form>
    </section>
    <section class="paneel"><h2>Postvak${S.post.filter(p=>p.status==="nieuw").length?` (${S.post.filter(p=>p.status==="nieuw").length} nieuw)`:""}</h2>
      <div class="postlijst">${post.length?post.map(p=>`<div class="postje">
        <span class="status ${p.status==="nieuw"?"nieuw":""}">${esc(lid(p.van).naam)} · ${POSTSOORT[p.soort]}${p.aan?` → ${esc(lid(p.aan).naam)}`:""} · ${p.status}</span>
        <span class="hand">${esc(p.tekst)}</span>${p.beeld?`<img src="${p.beeld}" alt="" style="max-width:160px">`:""}
        ${p.antwoord?`<span class="antw">Jouw antwoord: <span class="hand">${esc(p.antwoord)}</span></span>`:""}
        ${p.status==="nieuw"?`<div class="knoppen">
          ${p.soort==="briefje"?`<button class="knop klein" data-bezorg="${p.id}">Morgen in hun raampje (${Math.min(26,demoDag+1)} dec)</button>`:""}
          ${p.soort==="vraag"?`<input type="text" id="antw-${p.id}" placeholder="Jouw antwoord…" aria-label="Antwoord"><button class="knop klein" data-antw="${p.id}">Antwoord sturen</button>`:""}
          ${p.soort==="foto"?`<button class="knop klein" data-gezien="${p.id}">In het jaaroverzicht</button>`:""}
          <button class="knop klein licht" data-postweg="${p.id}">Weggooien</button></div>`:""}
      </div>`).join(""):'<p class="uitleg">Nog geen post. Alles wat het gezin in de brievenbus doet, komt hier binnen.</p>'}</div>
      ${ingewisseld.length?`<h3 class="kapitaal" style="margin-top:8px">Ingewisselde bonnen</h3>${ingewisseld.map(x=>`<div class="regel"><div><b>${esc(lid(x.wie).naam)}</b> · ${esc(x.it.tekst)} <span class="uitleg">(${esc(x.op)})</span></div></div>`).join("")}`:""}
      
    </section>
    <section class="paneel"><h2>Kerstdiner 25 december</h2>
      <label>Kerstmenu, één gang per regel (bijv. "Voorgerecht: tomatensoep")<textarea id="menu">${esc(S.menu)}</textarea></label>
      <div class="balk"><button class="knop klein" id="menuOpslaan" type="button">Menu opslaan</button></div>
      <h3 class="kapitaal">Wensen uit de brievenbus</h3>
      ${S.dinerwensen.map(w=>`<div class="regel"><div><span class="hand" style="font-size:22px">${esc(w.tekst)}</span> <span class="uitleg">van ${esc(lid(w.van).naam)}</span></div><button data-dwweg="${w.id}">Weghalen</button></div>`).join("")||'<p class="uitleg">Nog geen wensen.</p>'}
      <h3 class="kapitaal">Taken verdelen</h3>
      ${S.taken.map(t=>`<div class="regel"><div><b>${esc(lid(t.wie).naam)}</b>: ${esc(t.tekst)} ${t.klaar?'<span class="status">klaar ✓</span>':''}</div><button data-taakweg="${t.id}">Weghalen</button></div>`).join("")}
      <form id="taakform" class="formrij"><select id="taakwie" aria-label="Voor wie">${S.leden.map(l=>`<option value="${l.id}">${esc(l.naam)}</option>`).join("")}</select><input type="text" id="taaktekst" placeholder="bijv. tafel dekken" aria-label="Taak"><button class="knop">Taak geven</button></form>
      <div class="knoppen"><span class="uitleg">Snel kiezen:</span>${["Tafel dekken","Kaarsjes aansteken","Afwassen","Toetje maken","Muziek kiezen","Servetten vouwen"].map(t=>`<button type="button" class="hartje" data-snel="${t}">${t}</button>`).join("")}</div>
      <h3 class="kapitaal">Wie neemt wat mee</h3><div class="diner">${S.diner.map(d=>`<div><b>${esc(d.wie)}</b>: ${esc(d.wat)}</div>`).join("")||'<p class="uitleg">Nog niemand.</p>'}</div>
    </section>
    <section class="paneel"><h2>Wensen en samen doen</h2>
      <p class="uitleg">${S.leden.map(l=>`${esc(l.naam)}: ${S.wensen.filter(w=>w.van===l.id).length} wens${S.wensen.filter(w=>w.van===l.id).length===1?"":"en"}`).join(" · ")}</p>
      <h3 class="kapitaal" style="margin-top:6px">Ideeën uit de brievenbus</h3>
      ${[...S.ideeen].sort((a,b)=>b.stemmen.length-a.stemmen.length).map(i=>`<div class="regel"><div><span class="hand" style="font-size:22px">${esc(i.tekst)}</span> <span class="uitleg">♥ ${i.stemmen.length} · van ${esc(lid(i.van).naam)}</span></div>${i.uitje?`<span class="uitleg">dag ${i.uitje}</span>`:`<button data-maakuitje="${i.id}" style="color:var(--den)">Uitje op dag ${beheerDag}</button>`}</div>`).join("")||'<p class="uitleg">Nog geen ideeën.</p>'}
      <label>Spelleider van de Crazy Christmas Games<select id="leider">${S.leden.map(l=>`<option value="${l.id}" ${l.spelleider?"selected":""}>${esc(l.naam)}</option>`).join("")}</select></label>
    </section>
    <section class="paneel"><h2>Kies een dag</h2>
      <div class="dagkiezer">${Array.from({length:26},(_,i)=>i+1).map(d=>`<button data-d="${d}" class="${d===beheerDag?'aan':''}">${d}${tel(d)?`<span class="n">${tel(d)}</span>`:''}</button>`).join("")}</div>
    </section>
    <section class="paneel"><h2>Achter raampje ${beheerDag}</h2>
      <div class="lijst">${vanDag.length? vanDag.map(x=>`<div class="regel"><div><b>${esc(naam(x.voor))}</b> · ${SOORTEN[x.soort]} · <i>${SPELLEN[x.spel||(beheerDag%2?"kras":"lintje")]}</i>${x.mini?` · miniatuur: ${MINIS[x.mini]}`:""}${x.clip?` · clip: ${CLIPS[x.clip][0]}`:""}${x.film?` · filmpje: ${FILMS[x.film]}`:""}${x.kamer?` · ${KAMERS[x.kamer]}`:""}<br><span class="hand" style="font-size:22px">${esc(x.tekst||x.link||"(foto)")}</span>${x.waarde?` <b>${esc(x.waarde)}</b>`:""}</div><button data-weg="${x.id}">Weghalen</button></div>`).join("") : '<p class="uitleg">Nog niets. Voeg hieronder iets toe.</p>'}</div>
    </section>
    <form class="paneel" id="nieuw"><h2>Iets achter raampje ${beheerDag} stoppen</h2>
      <div class="rij">
        <label>Voor wie<select id="voor"><option value="alle">Iedereen (zelfde bericht)</option>${S.leden.map(l=>`<option value="${l.id}">${esc(l.naam)}</option>`).join("")}</select></label>
        <label>Wat<select id="soort">${Object.entries(SOORTEN).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
        <label>Hoe gaat het open<select id="spel">${Object.entries(SPELLEN).map(([k,v])=>`<option value="${k}" ${k===(beheerDag%2?"kras":"lintje")?"selected":""}>${v}</option>`).join("")}</select></label>
        <label>Miniatuurtje in het raam<select id="mini">${Object.entries(MINIS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
      </div>
      <div style="display:grid;gap:4px"><span class="uitleg" style="font-size:13px">Welk kamertje zit erachter?</span>
        <div class="kamerkeuze" id="kamerkeuze"><button type="button" class="auto" data-kamer="" aria-pressed="true">vanzelf</button>${KAMERLIJST.map(k=>`<button type="button" data-kamer="${k}" aria-pressed="false" title="${KAMERS[k]}" aria-label="${KAMERS[k]}" style="background-image:url(kamers/${k}.jpg)"></button>`).join("")}</div></div>
      <label>Tekst of briefje<textarea id="tekst" placeholder="Schrijf hier je briefje, aanwijzing of wat de bon waard is…"></textarea></label>
      <div id="veld-uitje" class="rij" hidden>
        <label>Wanneer<input type="text" id="wanneer" placeholder="bijv. zaterdagmiddag"></label>
        <label>Waar<input type="text" id="waar" placeholder="bijv. Groningen"></label>
        <label>Laten stemmen (met komma's)<input type="text" id="keuzes" placeholder="Kerstmarkt, Kringloop"></label>
      </div>
      <label id="veld-sfeerfilm" hidden>Welk sfeerfilmpje<select id="sfeerfilm">${Object.entries(FILMS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label>
      <label id="veld-clip" hidden>Kant-en-klare kerstclip (stopmotion met vloeiende sfeer)<select id="clip"><option value="">Eigen foto's uploaden als stopmotion</option>${Object.entries(CLIPS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></label>
      <label id="veld-waarde" hidden>Waarde van de bon<input type="text" id="waarde" placeholder="bijv. € 5 of 1x afwassen"></label>
      <label id="veld-film" hidden>Foto's voor de stopmotion (kies ze allemaal tegelijk, in volgorde)<input type="file" id="frames" accept="image/*" multiple></label>
      <label>Link (liedje, filmpje)<input type="url" id="link" placeholder="https://"></label>
      <label>Foto<input type="file" id="beeld" accept="image/*"></label>
      <button class="knop">Stop achter raampje ${beheerDag}</button>
    </form>
    ${ONLINE?`<section class="paneel"><h2>Opslag</h2><p class="uitleg">Alles wat je hier aanpast, wordt meteen in de database bewaard en is voor het hele gezin te zien.</p></section>`:`<section class="paneel"><h2>Demo</h2><p class="uitleg">Alles staat nu alleen op dit toestel.</p>
      <div class="balk"><button class="knop licht" id="alles" type="button">Demo terugzetten</button></div>
    </section>`}
  </div>`;
  $("#terug").onclick=()=>{ scherm="kalender"; teken(); };
  $$("[data-d]").forEach(b=>b.onclick=()=>{ beheerDag=+b.dataset.d; tekenBeheer(); });
  $$("[data-weg]").forEach(b=>b.onclick=()=>{ S.inhoud=S.inhoud.filter(x=>x.id!==b.dataset.weg); bewaar(); tekenBeheer(); melding("Weggehaald"); });
  const postVan = id => S.post.find(p=>p.id===id);
  $$("[data-bezorg]").forEach(b=>b.onclick=()=>{ const p=postVan(b.dataset.bezorg);
    S.inhoud.push({id:uid(), dag:Math.min(26,demoDag+1), voor:p.aan, soort:"briefje", spel:"deurtje", mini:"briefje", tekst:`Van ${lid(p.van).naam}:\n${p.tekst}`});
    p.status="bezorgd"; bewaar(); tekenBeheer(); melding(`Ligt morgen in het raampje van ${lid(p.aan).naam}`); });
  $$("[data-antw]").forEach(b=>b.onclick=()=>{ const p=postVan(b.dataset.antw), t=$("#antw-"+p.id).value.trim(); if(!t) return;
    p.antwoord=t; p.status="beantwoord"; p.gelezen=false; bewaar(); tekenBeheer(); melding("Antwoord verstuurd, het vlaggetje gaat omhoog"); });
  $$("[data-gezien]").forEach(b=>b.onclick=()=>{ postVan(b.dataset.gezien).status="in album"; bewaar(); tekenBeheer(); });
  $$("[data-postweg]").forEach(b=>b.onclick=()=>{ S.post=S.post.filter(p=>p.id!==b.dataset.postweg); bewaar(); tekenBeheer(); });
  $("#gezinform").onsubmit=e=>{ e.preventDefault();
    $$("#gezinform input[type=text]").forEach(inp=>{ const l=S.leden[+inp.dataset.i], v=inp.value.trim(); if(v) l[inp.dataset.v]=v; });
    bewaar(); tekenBeheer(); melding("Namen opgeslagen"); };
  $$("[data-lidweg]").forEach(b=>b.onclick=()=>{
    if(b.dataset.zeker!=="ja"){ b.dataset.zeker="ja"; b.textContent="zeker weten? tik nog eens"; return; }
    const id=b.dataset.lidweg; S.leden=S.leden.filter(l=>l.id!==id); S.geopend[id]=[]; S.inhoud=S.inhoud.filter(x=>x.voor!==id); bewaar(); tekenBeheer(); melding("Gezinslid verwijderd"); });
  $$("#gezinform input[type=text]").forEach(inp=>inp.onchange=()=>{ const l=S.leden[+inp.dataset.i]; l[inp.dataset.v]=inp.value.trim()||l[inp.dataset.v]; bewaar(); melding("Opgeslagen"); });
  $$("[data-foto]").forEach(inp=>inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return; S.leden[+inp.dataset.foto].foto=await verklein(f,240); bewaar(); tekenBeheer(); melding("Poppetje gemaakt"); });
  $$("[data-reset]").forEach(b=>b.onclick=()=>{ S.geopend[b.dataset.reset]=[]; bewaar(); melding("Ramen weer dicht"); });
  $("#erbij").onclick=()=>{ S.leden.push({id:uid(), naam:"Lid "+(S.leden.length+1), pin:"1234"}); bewaar(); tekenBeheer(); melding("Gezinslid toegevoegd"); };
  if($("#alles")) $("#alles").onclick=()=>{ S=voorbeeld(); bewaar(); ik=S.leden[0]; tekenBeheer(); melding("Demo teruggezet"); };
  let kamerKeuze="";
  $$("#kamerkeuze button").forEach(b=>b.onclick=()=>{ kamerKeuze=b.dataset.kamer; $$("#kamerkeuze button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); });
  const velden=()=>{ const s=$("#soort").value; $("#veld-waarde").hidden=s!=="bon"; $("#veld-clip").hidden=s!=="stopmotion"; $("#veld-film").hidden=s!=="stopmotion"||!!$("#clip").value; $("#veld-uitje").hidden=s!=="uitje"; $("#veld-sfeerfilm").hidden=s!=="film"; };
  $("#clip").onchange=velden;
  $$("[data-maakuitje]").forEach(b=>b.onclick=()=>{ const i=S.ideeen.find(x=>x.id===b.dataset.maakuitje);
    S.inhoud.push({id:uid(), dag:beheerDag, voor:"alle", soort:"uitje", spel:"kras", mini:"kaartje", tekst:i.tekst}); i.uitje=beheerDag; bewaar(); tekenBeheer(); melding(`Uitje staat achter raampje ${beheerDag}`); });
  $("#menuOpslaan").onclick=()=>{ S.menu=$("#menu").value; bewaar(); tekenBeheer(); melding("Kerstmenu opgeslagen"); };
  $$("[data-dwweg]").forEach(b=>b.onclick=()=>{ S.dinerwensen=S.dinerwensen.filter(w=>w.id!==b.dataset.dwweg); bewaar(); tekenBeheer(); });
  $$("[data-taakweg]").forEach(b=>b.onclick=()=>{ S.taken=S.taken.filter(t=>t.id!==b.dataset.taakweg); bewaar(); tekenBeheer(); });
  $$("[data-snel]").forEach(b=>b.onclick=()=>{ $("#taaktekst").value=b.dataset.snel; $("#taaktekst").focus(); });
  $("#taakform").onsubmit=e=>{ e.preventDefault(); const t=$("#taaktekst").value.trim(); if(!t) return; S.taken.push({id:uid(), wie:$("#taakwie").value, tekst:t, klaar:false}); bewaar(); tekenBeheer(); melding(`Taak gegeven aan ${lid(S.taken.at(-1).wie).naam}`); };
  $("#leider").onchange=e=>{ S.leden.forEach(l=>l.spelleider = l.id===e.target.value && !l.beheer); bewaar(); melding("Spelleider ingesteld"); };
  $("#soort").onchange=velden; velden();
  $("#nieuw").onsubmit=async e=>{ e.preventDefault();
    const it={id:uid(), dag:beheerDag, voor:$("#voor").value, soort:$("#soort").value, spel:$("#spel").value, mini:$("#mini").value, tekst:$("#tekst").value.trim(), link:$("#link").value.trim()};
    if(it.soort==="bon") it.waarde=$("#waarde").value.trim();
    if(kamerKeuze) it.kamer=kamerKeuze;
    if(it.soort==="uitje"){ it.wanneer=$("#wanneer").value.trim(); it.waar=$("#waar").value.trim(); const k=$("#keuzes").value.split(",").map(x=>x.trim()).filter(Boolean); if(k.length) it.keuzes=k; }
    if(it.soort==="stopmotion" && $("#clip").value) it.clip=$("#clip").value;
    if(it.soort==="film") it.film=$("#sfeerfilm").value;
    const f=$("#beeld").files[0]; if(f) it.beeld=await verklein(f,600);
    const fr=[...$("#frames").files]; if(it.soort==="stopmotion" && fr.length){ melding("Filmpje maken…"); it.frames=[]; for(const x of fr.slice(0,24)) it.frames.push(await verklein(x,420,.7)); }
    if(!it.tekst && !it.link && !it.beeld && !it.frames && !it.clip && !it.film){ melding("Schrijf iets, plak een link of kies een foto"); return; }
    S.inhoud.push(it); bewaar(); tekenBeheer(); melding(`Achter raampje ${beheerDag} gestopt`);
  };
}
function verklein(f,max=600,q=.8){ return new Promise(ok=>{ const r=new FileReader(); r.onload=()=>{ const im=new Image(); im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=im.width*s; c.height=im.height*s;
  c.getContext("2d").drawImage(im,0,0,c.width,c.height); ok(c.toDataURL("image/jpeg",q)); }; im.src=r.result; }; r.readAsDataURL(f); }); }

teken();
startOnline().then(teken);
</script>
